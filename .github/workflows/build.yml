name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild PowerSwitcher.sln /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path Build\Release\* -DestinationPath PowerSwitcher.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PowerSwitcher
          path: Build/Release/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PowerSwitcher.zip
